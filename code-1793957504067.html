    function shadeHexColor(hex, factor) {
      const clean = hex.replace('#', '');
      const num = parseInt(clean, 16);
      const r = Math.min(255, Math.max(0, Math.round(((num >> 16) & 255) * factor)));
      const g = Math.min(255, Math.max(0, Math.round(((num >> 8) & 255) * factor)));
      const b = Math.min(255, Math.max(0, Math.round((num & 255) * factor)));
      return `rgb(${r}, ${g}, ${b})`;
    }

    function addBox(faces, cx, cy, cz, w, h, d, color, opts = {}) {
      const hw = w / 2;
      const hh = h / 2;
      const hd = d / 2;
      const v = [
        [cx - hw, cy - hh, cz - hd],
        [cx + hw, cy - hh, cz - hd],
        [cx + hw, cy + hh, cz - hd],
        [cx - hw, cy + hh, cz - hd],
        [cx - hw, cy - hh, cz + hd],
        [cx + hw, cy - hh, cz + hd],
        [cx + hw, cy + hh, cz + hd],
        [cx - hw, cy + hh, cz + hd]
      ];
      faces.push({ verts: [v[4], v[5], v[6], v[7]], color, normal: [0, 0, 1], ...opts });
      faces.push({ verts: [v[1], v[0], v[3], v[2]], color, normal: [0, 0, -1], ...opts });
      faces.push({ verts: [v[0], v[4], v[7], v[3]], color, normal: [-1, 0, 0], ...opts });
      faces.push({ verts: [v[5], v[1], v[2], v[6]], color, normal: [1, 0, 0], ...opts });
      faces.push({ verts: [v[7], v[6], v[2], v[3]], color: opts.roofColor || color, normal: [0, 1, 0], ...opts });
    }

    function addPyramid(faces, cx, baseY, cz, w, h, d, color, opts = {}) {
      const hw = w / 2;
      const hd = d / 2;
      const apex = [cx, baseY + h, cz];
      const b0 = [cx - hw, baseY, cz + hd];
      const b1 = [cx + hw, baseY, cz + hd];
      const b2 = [cx + hw, baseY, cz - hd];
      const b3 = [cx - hw, baseY, cz - hd];

      faces.push({ verts: [b0, b1, apex], color, normal: [0, 0.4, 0.9], ...opts });
      faces.push({ verts: [b1, b2, apex], color, normal: [0.9, 0.4, 0], ...opts });
      faces.push({ verts: [b2, b3, apex], color, normal: [0, 0.4, -0.9], ...opts });
      faces.push({ verts: [b3, b0, apex], color, normal: [-0.9, 0.4, 0], ...opts });
    }

    function addCylinder(faces, cx, baseY, cz, radiusTop, radiusBottom, h, segments, color, opts = {}) {
      for (let i = 0; i < segments; i++) {
        const a1 = (i / segments) * Math.PI * 2;
        const a2 = ((i + 1) / segments) * Math.PI * 2;
        const x1b = cx + Math.cos(a1) * radiusBottom;
        const z1b = cz + Math.sin(a1) * radiusBottom;
        const x2b = cx + Math.cos(a2) * radiusBottom;
        const z2b = cz + Math.sin(a2) * radiusBottom;

        const x1t = cx + Math.cos(a1) * radiusTop;
        const z1t = cz + Math.sin(a1) * radiusTop;
        const x2t = cx + Math.cos(a2) * radiusTop;
        const z2t = cz + Math.sin(a2) * radiusTop;

        const midA = (a1 + a2) / 2;
        faces.push({
          verts: [
            [x1b, baseY, z1b],
            [x2b, baseY, z2b],
            [x2t, baseY + h, z2t],
            [x1t, baseY + h, z1t]
          ],
          color,
          normal: [Math.cos(midA), 0.2, Math.sin(midA)],
          ...opts
        });
      }
    }

    function addDome(faces, cx, baseY, cz, radius, h, segments, rings, color, opts = {}) {
      for (let r = 0; r < rings; r++) {
        const t1 = (r / rings) * (Math.PI / 2);
        const t2 = ((r + 1) / rings) * (Math.PI / 2);
        const y1 = baseY + Math.sin(t1) * h;
        const y2 = baseY + Math.sin(t2) * h;
        const rad1 = Math.cos(t1) * radius;
        const rad2 = Math.cos(t2) * radius;

        for (let s = 0; s < segments; s++) {
          const a1 = (s / segments) * Math.PI * 2;
          const a2 = ((s + 1) / segments) * Math.PI * 2;
          const midA = (a1 + a2) / 2;
          faces.push({
            verts: [
              [cx + Math.cos(a1) * rad1, y1, cz + Math.sin(a1) * rad1],
              [cx + Math.cos(a2) * rad1, y1, cz + Math.sin(a2) * rad1],
              [cx + Math.cos(a2) * rad2, y2, cz + Math.sin(a2) * rad2],
              [cx + Math.cos(a1) * rad2, y2, cz + Math.sin(a1) * rad2]
            ],
            color,
            normal: [Math.cos(midA) * Math.cos(t1), Math.sin(t1) + 0.3, Math.sin(midA) * Math.cos(t1)],
            ...opts
          });
        }
      }
    }

    // ==========================================
    // 3D AR-ВИДОИСКАТЕЛЬ
    // ==========================================

    function HighDpiARStage({
      location,
      splitPercent,
      setSplitPercent,
      isNightMode,
      renderMode,
      lodLevel,
      stageLayout,
      showHotspots,
      selectedHotspot,
      onSelectHotspot,
      solvedHotspots,
      cameraState,
      setCameraState,
      autoOrbit,
      setAutoOrbit
    }) {
      const containerRef = useRef(null);
      const canvasRef = useRef(null);
      const [projectedPins, setProjectedPins] = useState([]);
      const [isDraggingCamera, setIsDraggingCamera] = useState(false);
      const [isDraggingCurtain, setIsDraggingCurtain] = useState(false);
      const dragStartRef = useRef({ x: 0, y: 0, yaw: 0, pitch: 0 });
      const animTimeRef = useRef(0);

      const projectPoint = useCallback((pt, yaw, pitch, zoom, width, height) => {
        const [x, y, z] = pt;
        const cy = Math.cos(yaw);
        const sy = Math.sin(yaw);
        const cp = Math.cos(pitch);
        const sp = Math.sin(pitch);

        const dy = y - 2.55;
        const x1 = x * cy - z * sy;
        const z1 = x * sy + z * cy;
        const y2 = dy * cp - z1 * sp;
        const z2 = dy * sp + z1 * cp;

        const camDist = 11.4 / zoom;
        const depth = z2 + camDist;
        if (depth < 0.8) return null;

        const fov = Math.min(width, height) * 0.92;
        const sx = width * 0.5 + (x1 * fov) / depth;
        const syScreen = height * 0.56 - (y2 * fov) / depth;
        return { sx, sy: syScreen, depth, x1, y2, z2 };
      }, []);

      useEffect(() => {
        let rafId;
        let lastTs = performance.now();

        const renderFrame = (now) => {
          const dt = (now - lastTs) / 1000;
          lastTs = now;
          animTimeRef.current += dt;

          if (autoOrbit && !isDraggingCamera && !isDraggingCurtain) {
            setCameraState((prev) => ({
              ...prev,
              yaw: prev.yaw + dt * 0.36
            }));
          }

          const canvas = canvasRef.current;
          const container = containerRef.current;
          if (!canvas || !container) {
            rafId = requestAnimationFrame(renderFrame);
            return;
          }

          const rect = container.getBoundingClientRect();
          const width = Math.max(300, Math.floor(rect.width));
          const height = Math.max(340, Math.floor(rect.height));
          const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

          if (canvas.width !== Math.floor(width * dpr) || canvas.height !== Math.floor(height * dpr)) {
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
          }

          const ctx = canvas.getContext('2d');
          ctx.save();
          ctx.scale(dpr, dpr);
          ctx.clearRect(0, 0, width, height);

          const { yaw, pitch, zoom } = cameraState;
          const splitX = (splitPercent / 100) * width;

          const drawEnvironment = (isHistoricalEpoch) => {
            const horizonY = height * 0.56 - Math.sin(pitch) * (height * 0.28);

            const skyGrad = ctx.createLinearGradient(0, 0, 0, Math.max(horizonY, 60));
            if (renderMode === 'lidar') {
              skyGrad.addColorStop(0, '#020617');
              skyGrad.addColorStop(1, '#0f172a');
            } else if (isNightMode) {
              skyGrad.addColorStop(0, isHistoricalEpoch ? '#0f0b09' : '#090d16');
              skyGrad.addColorStop(0.6, isHistoricalEpoch ? '#271710' : '#111827');
              skyGrad.addColorStop(1, isHistoricalEpoch ? '#451a03' : '#1e293b');
            } else {
              skyGrad.addColorStop(0, isHistoricalEpoch ? '#fde68a' : '#7dd3fc');
              skyGrad.addColorStop(0.55, isHistoricalEpoch ? '#fef3c7' : '#bae6fd');
              skyGrad.addColorStop(1, isHistoricalEpoch ? '#fed7aa' : '#e2e8f0');
            }
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            const groundGrad = ctx.createLinearGradient(0, Math.max(0, horizonY), 0, height);
            if (renderMode === 'lidar') {
              groundGrad.addColorStop(0, '#091024');
              groundGrad.addColorStop(1, '#020617');
            } else if (isNightMode) {
              groundGrad.addColorStop(0, isHistoricalEpoch ? '#1c1613' : '#0f141c');
              groundGrad.addColorStop(1, '#090807');
            } else {
              groundGrad.addColorStop(0, isHistoricalEpoch ? '#a89f91' : '#94a3b8');
              groundGrad.addColorStop(1, isHistoricalEpoch ? '#57534e' : '#475569');
            }
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, Math.max(0, horizonY), width, height - Math.max(0, horizonY));

            ctx.lineWidth = 1;
            for (let g = -6; g <= 6; g++) {
              const pA = projectPoint([g, 0, -6], yaw, pitch, zoom, width, height);
              const pB = projectPoint([g, 0, 6], yaw, pitch, zoom, width, height);
              if (pA && pB) {
                ctx.strokeStyle =
                  renderMode === 'lidar'
                    ? 'rgba(56, 189, 248, 0.32)'
                    : isHistoricalEpoch
                    ? 'rgba(245, 158, 11, 0.25)'
                    : 'rgba(52, 211, 153, 0.25)';
                ctx.beginPath();
                ctx.moveTo(pA.sx, pA.sy);
                ctx.lineTo(pB.sx, pB.sy);
                ctx.stroke();
              }

              const pC = projectPoint([-6, 0, g], yaw, pitch, zoom, width, height);
              const pD = projectPoint([6, 0, g], yaw, pitch, zoom, width, height);
              if (pC && pD) {
                ctx.strokeStyle =
                  renderMode === 'lidar'
                    ? 'rgba(56, 189, 248, 0.32)'
                    : isHistoricalEpoch
                    ? 'rgba(245, 158, 11, 0.25)'
                    : 'rgba(52, 211, 153, 0.25)';
                ctx.beginPath();
                ctx.moveTo(pC.sx, pC.sy);
                ctx.lineTo(pD.sx, pD.sy);
                ctx.stroke();
              }
            }

            const sideFaces = [];
            const sideWallColor = isNightMode ? '#1e293b' : '#cbd5e1';
            addBox(sideFaces, -5.3, 1.8, -1.2, 1.8, 3.6, 3.2, sideWallColor);
            addBox(sideFaces, 5.3, 1.9, -1.2, 1.8, 3.8, 3.2, sideWallColor);

            sideFaces.forEach((f) => {
              const pts = f.verts.map((v) => projectPoint(v, yaw, pitch, zoom, width, height));
              if (pts.some((p) => !p)) return;
              ctx.beginPath();
              ctx.moveTo(pts[0].sx, pts[0].sy);
              for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].sx, pts[i].sy);
              ctx.closePath();
              ctx.fillStyle = isNightMode ? 'rgba(30,41,59,0.72)' : 'rgba(203,213,225,0.68)';
              ctx.fill();
              ctx.strokeStyle = 'rgba(52, 211, 153, 0.6)';
              ctx.setLineDash([4, 3]);
              ctx.stroke();
              ctx.setLineDash([]);
            });
          };

          if (splitX < width - 1) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(splitX, 0, width - splitX, height);
            ctx.clip();

            drawEnvironment(false);

            const modernTrees = [
              [-1.6, 0, 0.4],
              [1.6, 0, 0.4],
              [-0.8, 0, -1.1],
              [0.9, 0, -1.0]
            ];
            modernTrees.forEach(([tx, ty, tz]) => {
              const base = projectPoint([tx, ty, tz], yaw, pitch, zoom, width, height);
              const crown = projectPoint([tx, ty + 1.45, tz], yaw, pitch, zoom, width, height);
              if (base && crown) {
                ctx.strokeStyle = '#57534e';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(base.sx, base.sy);
                ctx.lineTo(crown.sx, crown.sy);
                ctx.stroke();

                ctx.fillStyle = isNightMode ? 'rgba(6, 95, 70, 0.78)' : 'rgba(22, 163, 74, 0.78)';
                ctx.beginPath();
                ctx.arc(crown.sx, crown.sy, Math.max(10, 145 / crown.depth), 0, Math.PI * 2);
                ctx.fill();
              }
            });

            const footprint = [
              [-2.8, 0.02, 1.6],
              [2.8, 0.02, 1.6],
              [2.8, 0.02, -1.6],
              [-2.8, 0.02, -1.6]
            ].map((v) => projectPoint(v, yaw, pitch, zoom, width, height));

            if (footprint.every(Boolean)) {
              ctx.beginPath();
              ctx.moveTo(footprint[0].sx, footprint[0].sy);
              footprint.slice(1).forEach((p) => ctx.lineTo(p.sx, p.sy));
              ctx.closePath();
              ctx.fillStyle = 'rgba(16, 185, 129, 0.14)';
              ctx.fill();
              ctx.strokeStyle = '#34d399';
              ctx.lineWidth = 2;
              ctx.setLineDash([6, 4]);
              ctx.stroke();
              ctx.setLineDash([]);
            }

            ctx.restore();
          }

          if (splitX > 1) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, splitX, height);
            ctx.clip();

            drawEnvironment(true);

            const shadowCorners = [
              [-3.2, 0.01, 2.0],
              [3.5, 0.01, 2.0],
              [3.9, 0.01, -2.2],
              [-2.9, 0.01, -2.2]
            ].map((v) => projectPoint(v, yaw, pitch, zoom, width, height));

            if (shadowCorners.every(Boolean)) {
              ctx.beginPath();
              ctx.moveTo(shadowCorners[0].sx, shadowCorners[0].sy);
              shadowCorners.slice(1).forEach((p) => ctx.lineTo(p.sx, p.sy));
              ctx.closePath();
              ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
              ctx.fill();
            }

            const rawFaces = buildMonumentGeometry(
              location.id,
              isNightMode,
              lodLevel,
              animTimeRef.current
            );

            const lightDir = [0.55, 0.72, 0.42];
            const projectedFaces = [];

            for (let i = 0; i < rawFaces.length; i++) {
              const face = rawFaces[i];
              const pts = [];
              let depthSum = 0;
              let valid = true;

              for (let j = 0; j < face.verts.length; j++) {
                const p = projectPoint(face.verts[j], yaw, pitch, zoom, width, height);
                if (!p) {
                  valid = false;
                  break;
                }
                pts.push(p);
                depthSum += p.depth;
              }
              if (!valid) continue;

              const [nx, ny, nz] = face.normal || [0, 1, 0];
              const dot = Math.max(0, nx * lightDir[0] + ny * lightDir[1] + nz * lightDir[2]);
              const lightFactor = face.emissive
                ? 1 + face.emissive * 0.38
                : (isNightMode ? 0.52 : 0.68) + dot * 0.42;

              projectedFaces.push({
                pts,
                avgDepth: depthSum / pts.length,
                fillStyle: shadeHexColor(face.color, lightFactor),
                emissive: face.emissive
              });
            }

            projectedFaces.sort((a, b) => b.avgDepth - a.avgDepth);

            for (let i = 0; i < projectedFaces.length; i++) {
              const pf = projectedFaces[i];
              ctx.beginPath();
              ctx.moveTo(pf.pts[0].sx, pf.pts[0].sy);
              for (let j = 1; j < pf.pts.length; j++) {
                ctx.lineTo(pf.pts[j].sx, pf.pts[j].sy);
              }
              ctx.closePath();

              if (renderMode === 'wireframe') {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
                ctx.fill();
                ctx.strokeStyle = pf.emissive ? '#fbbf24' : '#38bdf8';
                ctx.lineWidth = 1.1;
                ctx.stroke();
              } else if (renderMode === 'lidar') {
                ctx.fillStyle = 'rgba(8, 47, 73, 0.48)';
                ctx.fill();
                ctx.strokeStyle = '#34d399';
                ctx.lineWidth = 0.9;
                ctx.stroke();
                ctx.fillStyle = pf.emissive ? '#fbbf24' : '#38bdf8';
                pf.pts.forEach((pt) => {
                  ctx.fillRect(pt.sx - 1.5, pt.sy - 1.5, 3, 3);
                });
              } else {
                ctx.fillStyle = pf.fillStyle;
                ctx.fill();
                ctx.strokeStyle = isNightMode ? 'rgba(245, 158, 11, 0.22)' : 'rgba(68, 64, 60, 0.28)';
                ctx.lineWidth = 0.75;
                ctx.stroke();
              }
            }

            ctx.restore();
          }

          ctx.save();
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = 'rgba(245, 158, 11, 0.9)';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.moveTo(splitX, 0);
          ctx.lineTo(splitX, height);
          ctx.stroke();
          ctx.restore();

          const nextPins = (location.hotspots || [])
            .map((spot, idx) => {
              const proj = projectPoint(spot.pos3D || [0, 3.0, 0.8], yaw, pitch, zoom, width, height);
              if (!proj) return null;
              return {
                ...spot,
                index: idx + 1,
                sx: proj.sx,
                sy: proj.sy
              };
            })
            .filter(Boolean);

          setProjectedPins(nextPins);
          ctx.restore();
          rafId = requestAnimationFrame(renderFrame);
        };

        rafId = requestAnimationFrame(renderFrame);
        return () => cancelAnimationFrame(rafId);
      }, [
        location,
        splitPercent,
        isNightMode,
        renderMode,
        lodLevel,
        stageLayout,
        cameraState,
        autoOrbit,
        isDraggingCamera,
        isDraggingCurtain,
        projectPoint,
        setCameraState
      ]);

      const handlePointerDown = (e) => {
        const rect = containerRef.current?.getBoundingClientRect();
        if (!rect) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const relX = clientX - rect.left;
        const splitX = (splitPercent / 100) * rect.width;

        if (Math.abs(relX - splitX) < 24) {
          setIsDraggingCurtain(true);
          setAutoOrbit(false);
          return;
        }

        setIsDraggingCamera(true);
        setAutoOrbit(false);
        dragStartRef.current = {
          x: clientX,
          y: clientY,
          yaw: cameraState.yaw,
          pitch: cameraState.pitch
        };
      };

      const handlePointerMove = (e) => {
        const rect = containerRef.current?.getBoundingClientRect();
        if (!rect) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        if (isDraggingCurtain) {
          const pct = Math.min(96, Math.max(4, ((clientX - rect.left) / rect.width) * 100));
          setSplitPercent(Math.round(pct));
          return;
        }

        if (!isDraggingCamera) return;
        const dx = clientX - dragStartRef.current.x;
        const dy = clientY - dragStartRef.current.y;

        setCameraState((prev) => ({
          ...prev,
          yaw: dragStartRef.current.yaw + dx * 0.0085,
          pitch: Math.min(0.62, Math.max(-0.18, dragStartRef.current.pitch + dy * 0.0055))
        }));
      };

      const handlePointerUp = () => {
        setIsDraggingCamera(false);
        setIsDraggingCurtain(false);
      };

      return (
        <div
          ref={containerRef}
          onMouseDown={handlePointerDown}
          onMouseMove={handlePointerMove}
          onMouseUp={handlePointerUp}
          onMouseLeave={handlePointerUp}
          onTouchStart={handlePointerDown}
          onTouchMove={handlePointerMove}
          onTouchEnd={handlePointerUp}
          className={`relative w-full overflow-hidden select-none bg-stone-950 transition-all duration-300 ${
            stageLayout === 'phone'
              ? 'max-w-[430px] mx-auto h-[560px] rounded-[40px] border-[6px] border-stone-800 shadow-2xl'
              : 'h-[490px] sm:h-[560px] rounded-3xl border border-stone-800 shadow-2xl'
          } ${isDraggingCamera ? 'cursor-grabbing' : 'cursor-grab'}`}
        >
          <canvas ref={canvasRef} className="block w-full h-full" />

          {/* ВЕРХНИЙ ТЕЛЕМЕТРИЧЕСКИЙ HUD */}
          <div className="absolute top-3.5 inset-x-4 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
            <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-stone-950/85 backdrop-blur-md border border-stone-800 text-[11px] font-bold">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
              <span className="text-emerald-400">VPS &lt; 15 см • 60 FPS</span>
              <span className="text-stone-600">•</span>
              <span className="text-stone-200">
                #{location.number} {location.shortTitle}
              </span>
              <span className="hidden sm:inline text-stone-500">•</span>
              <span className="hidden sm:inline text-amber-400">
                {location.triangles[lodLevel]} треуг. ({lodLevel})
              </span>
            </div>

            <div className="flex items-center gap-1.5 pointer-events-auto">
              {[
                { label: 'Фасад', yaw: 0, pitch: 0.12 },
                { label: '3/4 Ракурс', yaw: -0.45, pitch: 0.18 },
                { label: 'Сверху', yaw: -0.3, pitch: 0.48 }
              ].map((preset) => (
                <button
                  key={preset.label}
                  onClick={(e) => {
                    e.stopPropagation();
                    setAutoOrbit(false);
                    setCameraState((prev) => ({ ...prev, yaw: preset.yaw, pitch: preset.pitch }));
                  }}
                  className="hidden sm:inline-block px-2.5 py-1 rounded-full bg-stone-950/85 hover:bg-stone-800 text-stone-300 border border-stone-700 text-[10px] font-bold cursor-pointer"
                >
                  {preset.label}
                </button>
              ))}

              <button
                onClick={(e) => {
                  e.stopPropagation();
                  setAutoOrbit(!autoOrbit);
                }}
                className={`px-2.5 py-1 rounded-full text-[11px] font-bold border transition-all cursor-pointer ${
                  autoOrbit
                    ? 'bg-amber-400 text-stone-950 border-amber-300'
                    : 'bg-stone-950/85 text-stone-300 border-stone-700 hover:text-white'
                }`}
              >
                {autoOrbit ? '360° Авто: ВКЛ' : '360° Облет'}
              </button>
            </div>
          </div>

          {/* МАРКЕРЫ СЛОЕВ ВРЕМЕНИ */}
          <div className="absolute top-14 left-4 z-10 px-2.5 py-1 rounded-lg bg-amber-500/90 text-stone-950 text-[10px] font-black uppercase tracking-wider shadow pointer-events-none">
            ◄ 1896 год • Реконструкция 1:1
          </div>
          <div className="absolute top-14 right-4 z-10 px-2.5 py-1 rounded-lg bg-stone-950/85 text-emerald-300 border border-emerald-500/40 text-[10px] font-bold uppercase tracking-wider pointer-events-none">
            Наши дни • VPS-привязка ►
          </div>

          {/* РУЧКА ПЕРЕТАСКИВАНИЯ ШТОРКИ ВРЕМЕНИ */}
          <div
            style={{ left: `${splitPercent}%` }}
            className="absolute top-1/2 -translate-x-1/2 -translate-y-1/2 z-20 pointer-events-none"
          >
            <div className="w-9 h-9 rounded-full bg-amber-400 text-stone-950 shadow-xl flex items-center justify-center border-2 border-stone-950">
              <MoveHorizontal className="w-4 h-4" />
            </div>
          </div>

          {/* 3D-МЕТКИ НА ФАСАДЕ */}
          {showHotspots &&
            projectedPins.map((pin) => {
              const isSolved = solvedHotspots.includes(pin.id);
              const isCurrent = selectedHotspot?.id === pin.id;
              return (
                <button
                  key={pin.id}
                  onClick={(e) => {
                    e.stopPropagation();
                    onSelectHotspot(pin);
                  }}
                  style={{ left: `${pin.sx}px`, top: `${pin.sy}px` }}
                  className={`absolute -translate-x-1/2 -translate-y-1/2 z-30 flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-extrabold transition-transform cursor-pointer shadow-lg ${
                    isSolved
                      ? 'bg-emerald-400 text-stone-950 ring-4 ring-emerald-400/30'
                      : isCurrent
                      ? 'bg-amber-400 text-stone-950 ring-4 ring-amber-300/60 scale-110'
                      : 'bg-stone-950/90 text-amber-300 border border-amber-400 hover:bg-amber-400 hover:text-stone-950'
                  }`}
                >
                  <span className="w-4 h-4 rounded-full bg-stone-950 text-amber-400 text-[10px] flex items-center justify-center font-black">
                    {isSolved ? '✓' : pin.index}
                  </span>
                  <span className="hidden sm:inline">{pin.label}</span>
                </button>
              );
            })}

          {/* НИЖНЯЯ ПАНЕЛЬ УПРАВЛЕНИЯ */}
          <div
            onClick={(e) => e.stopPropagation()}
            onMouseDown={(e) => e.stopPropagation()}
            className="absolute bottom-3.5 inset-x-4 z-30 flex flex-wrap items-center justify-between gap-3 px-4 py-2.5 rounded-2xl bg-stone-950/85 backdrop-blur-md border border-stone-800/90"
          >
            <div className="flex items-center gap-2 text-[11px] text-stone-300">
              <Compass className="w-4 h-4 text-amber-400 shrink-0" />
              <span className="hidden md:inline">Вращайте 3D-модель мышью на 360° • тяните шторку</span>
              <span className="md:hidden">Вращайте 3D-модель пальцем</span>
            </div>

            <div className="flex items-center gap-2.5 flex-1 max-w-xs">
              <span className="text-[10px] font-extrabold text-amber-400 whitespace-nowrap">
                1896 ({splitPercent}%)
              </span>
              <input
                type="range"
                min="5"
                max="95"
                value={splitPercent}
                onChange={(e) => setSplitPercent(Number(e.target.value))}
                className="w-full accent-amber-400 h-1.5 bg-stone-800 rounded-lg cursor-pointer"
              />
              <span className="text-[10px] font-bold text-stone-400 whitespace-nowrap">Наши дни</span>
            </div>

            <div className="flex items-center gap-1">
              <button
                onClick={() =>
                  setCameraState((prev) => ({ ...prev, zoom: Math.max(0.75, prev.zoom - 0.15) }))
                }
                className="p-1.5 rounded-lg bg-stone-900 hover:bg-stone-800 text-stone-300 border border-stone-700 cursor-pointer"
                title="Отдалить"
              >
                <ZoomOut className="w-3.5 h-3.5" />
              </button>
              <button
                onClick={() =>
                  setCameraState((prev) => ({ ...prev, zoom: Math.min(1.6, prev.zoom + 0.15) }))
                }
                className="p-1.5 rounded-lg bg-stone-900 hover:bg-stone-800 text-stone-300 border border-stone-700 cursor-pointer"
                title="Приблизить"
              >
                <ZoomIn className="w-3.5 h-3.5" />
              </button>
              <button
                onClick={() => setCameraState({ yaw: -0.35, pitch: 0.16, zoom: 1.0 })}
                className="p-1.5 rounded-lg bg-stone-900 hover:bg-stone-800 text-stone-300 border border-stone-700 cursor-pointer"
                title="Сбросить ракурс"
              >
                <RotateCcw className="w-3.5 h-3.5" />
              </button>
            </div>
          </div>
        </div>
      );
    }

                  <button

              </div>

                  return (
                    <div
                      key={idx}
                      className="rounded-2xl bg-stone-900 border border-stone-800 overflow-hidden"
                    >
                      <button
                        onClick={() => setOpenFaqIndex(isOpen ? -1 : idx)}
                        className="w-full px-5 py-4 text-left flex items-center justify-between gap-4 cursor-pointer"

                        <ChevronDown

                <div className="flex items-center justify-between border-b border-stone-800 pb-3">
                  <div className="flex items-center gap-2">
                    <QrCode className="w-5 h-5 text-amber-400" />

                  <button
                    onClick={() => setShowSbpModal(false)}
                    className="text-stone-400 hover:text-white cursor-pointer"

                    <X className="w-5 h-5" />

                <div className="text-center space-y-1">
                  <div className="text-xs text-stone-400">Полный сюжетный квест-маршрут (10 зданий 1:1)</div>

                </div>

                <div className="mx-auto w-44 h-44 rounded-2xl bg-white p-3 flex flex-col items-center justify-center shadow-inner">
                  <QrCode className="w-32 h-32 text-stone-950" />

                      setIsPremiumUnlocked(true);

                    Подтвердить тестовую оплату (Разблокировать все 10)

                  <p className="text-[11px] text-center text-stone-400">
                    Сразу открывает все 10 памятников, дикторский аудиогид и 5 купонов кофеен.

            </div>

                <div className="flex items-center justify-between border-b border-stone-800 pb-3">
                  <div className="flex items-center gap-2">
                    <Coffee className="w-5 h-5 text-amber-400" />
                    <span className="font-extrabold text-white">Купон гостя «ХрониAR»</span>
                  </div>
                  <button
                    onClick={() => setActiveCafeCoupon(null)}
                    className="text-stone-400 hover:text-white cursor-pointer"

                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="text-center space-y-1.5">
                  <span className="px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-500/20 text-emerald-300">

                </div>

                <div className="p-4 rounded-2xl bg-stone-950 border border-dashed border-amber-400/60 text-center space-y-2">

                  <div className="text-2xl font-black tracking-wider text-amber-400">
                    {activeCafeCoupon.promoCode}

                  <button
                    onClick={() => handleCopyCode(activeCafeCoupon.promoCode)}
                    className="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-xl bg-amber-400 text-stone-950 text-xs font-extrabold cursor-pointer"
                  >
                    {copiedPromo === activeCafeCoupon.promoCode ? (
                      <>
                        <Check className="w-3.5 h-3.5" /> Скопировано!
                      </>
                    ) : (
                      <>
                        <Copy className="w-3.5 h-3.5" /> Скопировать код
                      </>
                    )}
                  </button>
                </div>

                <p className="text-[11px] text-center text-stone-400">
                  Фирменный выбор: {activeCafeCoupon.specialty}
                </p>
              </div>
            </div>
          )}

          {showRuStoreModal && (
            <div className="fixed inset-0 z-50 bg-stone-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full max-w-lg rounded-3xl bg-stone-900 border border-stone-700 p-6 space-y-5 shadow-2xl">
                <div className="flex items-center justify-between border-b border-stone-800 pb-3">
                  <div className="flex items-center gap-2">
                    <div className="w-7 h-7 rounded-lg bg-blue-600 flex items-center justify-center font-black text-white text-xs">
                      Ru

                    <span className="font-extrabold text-white">Официальный релиз в RuStore</span>
                  </div>
                  <button
                    onClick={() => setShowRuStoreModal(false)}
                    className="text-stone-400 hover:text-white cursor-pointer"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="flex items-center gap-4">
                  <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center shadow-lg shrink-0">
                    <Compass className="w-9 h-9 text-stone-950" />
                  </div>
                  <div>
                    <h4 className="text-lg font-black text-white">ХрониAR: Архитектура 1:1</h4>
                    <p className="text-xs text-stone-400">Версия 1.0 • Туризм и AR-квесты • Нижний Новгород</p>
                    <div className="flex items-center gap-3 mt-1.5 text-xs font-bold">
                      <span className="text-amber-400 flex items-center gap-1">
                        <Star className="w-3.5 h-3.5 fill-current" /> 4.9
                      </span>
                      <span className="text-emerald-400">Вес APK: 45 МБ</span>
                      <span className="text-stone-300">60 FPS • S3 Cloud</span>
                    </div>
                  </div>
                </div>

                {apkDownloaded ? (
                  <div className="p-3 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-bold text-center">
                    ✓ Установочный пакет «ХрониAR» (45 МБ) успешно скачан!
                  </div>
                ) : (
                  <button
                    onClick={() => {
                      setIsDownloadingApk(true);
                      setTimeout(() => {
                        setIsDownloadingApk(false);
                        setApkDownloaded(true);
                      }, 1000);
                    }}
                    disabled={isDownloadingApk}
                    className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-stone-950 font-extrabold text-sm shadow-lg cursor-pointer"
                  >
                    {isDownloadingApk ? 'Загрузка APK (45 МБ)...' : 'Скачать бесплатно из RuStore (45 МБ)'}
                  </button>
                )}
              </div>
            </div>
          )}

          {/* ПОДВАЛ */}
          <footer className="bg-stone-950 py-10 border-t border-stone-800/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-stone-400">
              <div className="flex items-center gap-2.5">
                <div className="w-7 h-7 rounded-lg bg-amber-400 flex items-center justify-center text-stone-950 font-black">
                  <Compass className="w-4 h-4" />
                </div>
                <span className="font-bold text-white">ХрониAR</span>
                <span>— Мобильная AR-платформа 3D-реконструкции архитектуры Нижнего Новгорода 1:1</span>
              </div>
              <div className="flex flex-wrap items-center gap-4">
                <button onClick={() => scrollToSection('simulator-section')} className="hover:text-amber-400 cursor-pointer">
                  3D-Симулятор (10 зданий)

                <button onClick={() => scrollToSection('catalog-section')} className="hover:text-amber-400 cursor-pointer">
                  Каталог объектов
                </button>
                <button onClick={() => scrollToSection('map-section')} className="hover:text-amber-400 cursor-pointer">
                  Карта маршрутов
                </button>
                <button onClick={() => setShowRuStoreModal(true)} className="hover:text-amber-400 cursor-pointer">
                  RuStore (45 МБ)
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
